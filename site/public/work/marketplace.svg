<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Architecture: a React storefront, wallet authentication, and on-chain ownership across linked blocks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0d07"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#C2410C" stop-opacity="0.28"/><stop offset="1" stop-color="#C2410C" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#FDBA74" fill-opacity="0.08"/></pattern>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c1208"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <style>
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:600}
      .flow{stroke-dasharray:6 10;animation:dash 3s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-64}}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @media (max-width:899px){.mono{display:none}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- storefront (React) -->
  <g>
    <rect x="90" y="110" width="420" height="380" rx="26" fill="#121212" stroke="#3a1d10" stroke-width="2"/>
    <rect x="90" y="110" width="420" height="52" rx="26" fill="#161616"/>
    <rect x="90" y="140" width="420" height="22" fill="#161616"/>
    <circle cx="122" cy="136" r="6" fill="#F97316"/><circle cx="144" cy="136" r="6" fill="#7C2D12"/><circle cx="166" cy="136" r="6" fill="#7C2D12"/>
    <rect x="200" y="126" width="200" height="20" rx="10" fill="#0a0a0a"/>
    <!-- product grid -->
    <rect x="118" y="188" width="116" height="116" rx="16" fill="#2c1208"/><rect x="242" y="188" width="116" height="116" rx="16" fill="#7C2D12"/><rect x="366" y="188" width="116" height="116" rx="16" fill="#2c1208"/>
    <rect x="118" y="318" width="116" height="42" rx="10" fill="#161616"/><rect x="242" y="318" width="116" height="42" rx="10" fill="#161616"/><rect x="366" y="318" width="116" height="42" rx="10" fill="#161616"/>
    <rect x="132" y="333" width="70" height="8" rx="4" fill="#3a1d10"/><rect x="256" y="333" width="70" height="8" rx="4" fill="#3a1d10"/><rect x="380" y="333" width="70" height="8" rx="4" fill="#3a1d10"/>
    <!-- buy button -->
    <rect x="118" y="392" width="364" height="60" rx="30" fill="#F97316"/>
    <text x="300" y="428" class="mono" fill="#0a0a0a" text-anchor="middle" font-size="14">Buy · own it on-chain</text>
  </g>
  <text x="300" y="530" class="mono" fill="#a3a3a3" text-anchor="middle" font-size="12">React · 50K+ users</text>

  <!-- flow to wallet -->
  <path d="M510 300 H 640" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M510 300 H 640" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>

  <!-- wallet -->
  <g>
    <rect x="640" y="220" width="240" height="160" rx="24" fill="#2c1208" stroke="#C2410C" stroke-width="2"/>
    <rect x="640" y="250" width="240" height="30" fill="#7C2D12"/>
    <rect x="800" y="288" width="60" height="40" rx="12" fill="#121212" stroke="#F97316" stroke-width="2"/>
    <circle cx="840" cy="308" r="7" fill="#F97316"/>
    <rect x="664" y="300" width="100" height="10" rx="5" fill="#FDBA74"/>
    <rect x="664" y="322" width="60" height="8" rx="4" fill="#C2410C"/>
    <!-- session key: account + chain -->
    <rect x="664" y="346" width="56" height="18" rx="9" fill="#121212"/>
    <rect x="728" y="346" width="56" height="18" rx="9" fill="#121212"/>
  </g>
  <g class="mono" fill="#FDBA74" font-size="11">
    <rect x="620" y="410" width="130" height="34" rx="17" fill="#121212" stroke="#3a1d10"/><text x="685" y="432" text-anchor="middle">MetaMask</text>
    <rect x="760" y="410" width="150" height="34" rx="17" fill="#121212" stroke="#3a1d10"/><text x="835" y="432" text-anchor="middle">WalletConnect</text>
  </g>

  <!-- flow to chain -->
  <path d="M880 300 H 990" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M880 300 H 990" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>

  <!-- chain of blocks -->
  <g stroke-width="2">
    <rect x="990" y="240" width="120" height="120" rx="22" fill="url(#block)" stroke="#7C2D12"/>
    <rect x="1150" y="240" width="120" height="120" rx="22" fill="url(#block)" stroke="#C2410C"/>
    <rect x="1310" y="240" width="120" height="120" rx="22" fill="url(#block)" stroke="#F97316" class="pulse"/>
    <line x1="1110" y1="300" x2="1150" y2="300" stroke="#C2410C"/>
    <line x1="1270" y1="300" x2="1310" y2="300" stroke="#F97316"/>
    <!-- hashes -->
    <g fill="#7C2D12"><rect x="1012" y="266" width="76" height="8" rx="4"/><rect x="1012" y="284" width="54" height="8" rx="4"/><rect x="1012" y="302" width="66" height="8" rx="4"/></g>
    <g fill="#C2410C"><rect x="1172" y="266" width="76" height="8" rx="4"/><rect x="1172" y="284" width="48" height="8" rx="4"/><rect x="1172" y="302" width="70" height="8" rx="4"/></g>
    <g fill="#FDBA74"><rect x="1332" y="266" width="76" height="8" rx="4"/><rect x="1332" y="284" width="58" height="8" rx="4"/><rect x="1332" y="302" width="64" height="8" rx="4"/></g>
    <!-- token badges -->
    <circle cx="1080" cy="336" r="8" fill="#7C2D12" stroke="none"/><circle cx="1240" cy="336" r="8" fill="#C2410C" stroke="none"/><circle cx="1400" cy="336" r="8" fill="#F97316" stroke="none"/>
  </g>
  <text x="1210" y="410" class="mono" fill="#a3a3a3" text-anchor="middle" font-size="12">Solidity · ERC-721 / 1155 · 1M+ tx</text>

  <!-- chip -->
  <g class="mono">
    <rect x="1190" y="480" width="320" height="48" rx="24" fill="#121212" stroke="#3a1d10"/>
    <text x="1350" y="510" fill="#FDBA74" text-anchor="middle" font-size="13">Gas −10% · page load −75%</text>
  </g>
</svg>

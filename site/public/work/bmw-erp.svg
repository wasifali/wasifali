<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Architecture: two marques feed an API gateway and Redis cache in front of a 52-service estate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0d07"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.55"><stop offset="0" stop-color="#F97316" stop-opacity="0.22"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#FDBA74" fill-opacity="0.08"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;font-size:14px;font-weight:600}
      .flow{stroke-dasharray:6 10;animation:dash 3s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-64}}
      @media (max-width:899px){.mono{display:none}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- inputs: two marques -->
  <g class="mono" fill="#FDBA74">
    <rect x="80" y="196" width="220" height="56" rx="28" fill="#2c1208" stroke="#3a1d10"/>
    <text x="190" y="230" text-anchor="middle">MINI</text>
    <rect x="80" y="348" width="220" height="56" rx="28" fill="#2c1208" stroke="#3a1d10"/>
    <text x="190" y="382" text-anchor="middle">MOTORRAD</text>
  </g>
  <path d="M300 224 C 360 224, 360 300, 420 300" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M300 376 C 360 376, 360 300, 420 300" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M300 224 C 360 224, 360 300, 420 300" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>
  <path d="M300 376 C 360 376, 360 300, 420 300" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>

  <!-- gateway -->
  <g>
    <rect x="420" y="240" width="150" height="120" rx="22" fill="#121212" stroke="#3a1d10" stroke-width="2"/>
    <rect x="450" y="270" width="90" height="10" rx="5" fill="#F97316"/>
    <rect x="450" y="292" width="64" height="8" rx="4" fill="#7C2D12"/>
    <rect x="450" y="310" width="76" height="8" rx="4" fill="#7C2D12"/>
    <text x="495" y="392" class="mono" fill="#a3a3a3" text-anchor="middle" font-size="12">Gateway</text>
  </g>
  <path d="M570 300 H 660" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M570 300 H 660" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>

  <!-- redis cache cylinder -->
  <g>
    <ellipse cx="740" cy="360" rx="80" ry="22" fill="#2c1208" stroke="#C2410C" stroke-width="2"/>
    <rect x="660" y="240" width="160" height="120" fill="#2c1208"/>
    <line x1="660" y1="240" x2="660" y2="360" stroke="#C2410C" stroke-width="2"/>
    <line x1="820" y1="240" x2="820" y2="360" stroke="#C2410C" stroke-width="2"/>
    <ellipse cx="740" cy="300" rx="80" ry="22" fill="none" stroke="#7C2D12" stroke-width="2"/>
    <ellipse cx="740" cy="240" rx="80" ry="22" fill="#7C2D12" stroke="#F97316" stroke-width="2"/>
    <text x="740" y="412" class="mono" fill="#a3a3a3" text-anchor="middle" font-size="12">Redis cache</text>
  </g>
  <path d="M820 300 H 900" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M820 300 H 900" fill="none" stroke="#F97316" stroke-width="2" class="flow"/>

  <!-- 52 services: 13 x 4 grid -->
  <g id="services">
    <rect x="900" y="140" width="620" height="320" rx="28" fill="#121212" fill-opacity="0.6" stroke="#2a1a12"/>
  </g>
  <g fill="#7C2D12">
    <!-- row 1 -->
    <rect x="930" y="170" width="34" height="34" rx="9" fill="#F97316"/><rect x="974" y="170" width="34" height="34" rx="9"/><rect x="1018" y="170" width="34" height="34" rx="9"/><rect x="1062" y="170" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1106" y="170" width="34" height="34" rx="9"/><rect x="1150" y="170" width="34" height="34" rx="9"/><rect x="1194" y="170" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1238" y="170" width="34" height="34" rx="9"/><rect x="1282" y="170" width="34" height="34" rx="9"/><rect x="1326" y="170" width="34" height="34" rx="9"/><rect x="1370" y="170" width="34" height="34" rx="9" fill="#F97316"/><rect x="1414" y="170" width="34" height="34" rx="9"/><rect x="1458" y="170" width="34" height="34" rx="9"/>
    <!-- row 2 -->
    <rect x="930" y="234" width="34" height="34" rx="9"/><rect x="974" y="234" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1018" y="234" width="34" height="34" rx="9"/><rect x="1062" y="234" width="34" height="34" rx="9"/><rect x="1106" y="234" width="34" height="34" rx="9" fill="#F97316"/><rect x="1150" y="234" width="34" height="34" rx="9"/><rect x="1194" y="234" width="34" height="34" rx="9"/><rect x="1238" y="234" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1282" y="234" width="34" height="34" rx="9"/><rect x="1326" y="234" width="34" height="34" rx="9" fill="#FDBA74"/><rect x="1370" y="234" width="34" height="34" rx="9"/><rect x="1414" y="234" width="34" height="34" rx="9"/><rect x="1458" y="234" width="34" height="34" rx="9" fill="#C2410C"/>
    <!-- row 3 -->
    <rect x="930" y="298" width="34" height="34" rx="9" fill="#C2410C"/><rect x="974" y="298" width="34" height="34" rx="9"/><rect x="1018" y="298" width="34" height="34" rx="9" fill="#FDBA74"/><rect x="1062" y="298" width="34" height="34" rx="9"/><rect x="1106" y="298" width="34" height="34" rx="9"/><rect x="1150" y="298" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1194" y="298" width="34" height="34" rx="9"/><rect x="1238" y="298" width="34" height="34" rx="9"/><rect x="1282" y="298" width="34" height="34" rx="9" fill="#F97316"/><rect x="1326" y="298" width="34" height="34" rx="9"/><rect x="1370" y="298" width="34" height="34" rx="9"/><rect x="1414" y="298" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1458" y="298" width="34" height="34" rx="9"/>
    <!-- row 4 -->
    <rect x="930" y="362" width="34" height="34" rx="9"/><rect x="974" y="362" width="34" height="34" rx="9"/><rect x="1018" y="362" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1062" y="362" width="34" height="34" rx="9"/><rect x="1106" y="362" width="34" height="34" rx="9"/><rect x="1150" y="362" width="34" height="34" rx="9" fill="#F97316"/><rect x="1194" y="362" width="34" height="34" rx="9"/><rect x="1238" y="362" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1282" y="362" width="34" height="34" rx="9"/><rect x="1326" y="362" width="34" height="34" rx="9"/><rect x="1370" y="362" width="34" height="34" rx="9" fill="#C2410C"/><rect x="1414" y="362" width="34" height="34" rx="9"/><rect x="1458" y="362" width="34" height="34" rx="9" fill="#F97316"/>
  </g>
  <text x="1210" y="500" class="mono" fill="#a3a3a3" text-anchor="middle" font-size="12">52 services · 200K req / day</text>

  <!-- latency chip -->
  <g class="mono">
    <rect x="80" y="480" width="330" height="48" rx="24" fill="#121212" stroke="#3a1d10"/>
    <text x="245" y="510" fill="#FDBA74" text-anchor="middle" font-size="13">1500 ms → 600 ms</text>
  </g>
</svg>

name: Generate profile assets

# Regenerates the contribution snake and the self-hosted stats cards (streak + activity)
# and publishes them to the `output` branch, which the README embeds via raw URLs.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards (streak + activity)
        # Runs BEFORE the snake action (which runs in Docker as root and leaves dist/ root-owned).
        # Private contributions are included only if "Private contributions" is enabled on the profile.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build-stats.py dist

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F97316&color_dots=#f5f5f5,#FDBA74,#F97316,#C2410C,#7C2D12
            dist/github-snake-dark.svg?color_snake=#F97316&color_dots=#0a0a0a,#7C2D12,#C2410C,#F97316,#FDBA74

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
